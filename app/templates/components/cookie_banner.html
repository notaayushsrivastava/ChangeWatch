<!-- Cookie & Local Storage Consent Banner -->
<div id="cw-cookie-banner" class="hidden fixed bottom-[max(1rem,calc(1rem+env(safe-area-inset-bottom)))] right-4 left-4 sm:left-auto sm:max-w-md z-50 transition-all duration-300">
  <div class="double-bezel shadow-2xl bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md">
    <div class="double-bezel-inner p-5 space-y-3.5">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 border border-blue-200/60 dark:border-blue-900/60 flex items-center justify-center shrink-0 shadow-2xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-xs font-bold text-zinc-950 dark:text-zinc-100 tracking-tight">Privacy &amp; Cookie Preferences</h4>
          <p class="text-[11px] text-zinc-600 dark:text-zinc-300 mt-1 leading-relaxed">
            ChangeWatch uses essential session cookies and local storage exclusively for authentication, CSRF defense, and persisting your dark mode and animation settings. No third-party tracking or advertising scripts are deployed.
          </p>
          <div class="flex items-center gap-2 mt-1.5 text-[10px] text-zinc-400 font-mono">
            <a href="/privacy" class="text-blue-600 dark:text-blue-400 hover:underline">Privacy Policy</a>
            <span>•</span>
            <a href="/terms" class="text-blue-600 dark:text-blue-400 hover:underline">Terms of Service</a>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-zinc-150 dark:border-zinc-800">
        <button type="button" onclick="setCookieConsent('essential')" class="min-h-[44px] px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors flex items-center justify-center" aria-label="Use essential cookies only">
          Essential Only
        </button>
        <button type="button" onclick="setCookieConsent('accepted')" class="min-h-[44px] px-4 py-2 rounded-xl text-xs font-bold bg-zinc-950 dark:bg-zinc-100 text-white dark:text-zinc-950 hover:bg-zinc-800 dark:hover:bg-white shadow-xs transition-colors flex items-center justify-center" aria-label="Accept all preferences">
          Accept All
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  (function initCookieBanner() {
    try {
      const consent = localStorage.getItem('cw_cookie_consent');
      if (!consent) {
        const banner = document.getElementById('cw-cookie-banner');
        if (banner) {
          banner.classList.remove('hidden');
        }
      }
    } catch (e) {}
  })();

  function setCookieConsent(preference) {
    try {
      localStorage.setItem('cw_cookie_consent', preference);
      const banner = document.getElementById('cw-cookie-banner');
      if (banner) {
        banner.classList.add('hidden');
      }
    } catch (e) {}
  }
</script>
