{% extends "base.html" %}

{% block title %}Create Account — ChangeWatch{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center items-center">
  <div class="double-bezel w-full max-w-md">
    <div class="double-bezel-inner p-8 md:p-10">
      <div class="mb-8 text-center">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/25">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </div>
        <div class="eyebrow-badge bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 mb-2">Registration</div>
        <h1 class="text-2xl font-extrabold text-zinc-950 dark:text-zinc-50 tracking-tight">Create your account</h1>
        <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">Start tracking public web pages with verified diff evidence.</p>
      </div>

      {% if error %}
      <div role="alert" aria-live="polite" class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 dark:border-red-900/70 dark:bg-red-950/40 dark:text-red-200">
        {{ error }}
      </div>
      {% endif %}

      <form action="/auth/signup" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
          <label for="email" class="block text-[11px] font-bold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider mb-2">Email address</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email" class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors bg-zinc-50/50 dark:bg-zinc-900/60 text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:placeholder:text-zinc-600" placeholder="you@domain.com">
        </div>

        <div>
          <label for="password" class="block text-[11px] font-bold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider mb-2">Password</label>
          <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password" class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors bg-zinc-50/50 dark:bg-zinc-900/60 text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:placeholder:text-zinc-600" placeholder="Minimum 8 characters">
        </div>

        <div>
          <label for="timezone" class="block text-[11px] font-bold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider mb-2">Timezone</label>
          <select id="timezone" name="timezone" class="w-full px-4 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors bg-zinc-50/50 dark:bg-zinc-900/60 text-zinc-900 dark:text-zinc-100 font-medium">
            <option value="UTC" {% if not email_timezone or email_timezone == "UTC" %}selected{% endif %}>UTC</option>
            <option value="America/New_York" {% if email_timezone == "America/New_York" %}selected{% endif %}>Eastern Time (US)</option>
            <option value="America/Chicago" {% if email_timezone == "America/Chicago" %}selected{% endif %}>Central Time (US)</option>
            <option value="America/Denver" {% if email_timezone == "America/Denver" %}selected{% endif %}>Mountain Time (US)</option>
            <option value="America/Los_Angeles" {% if email_timezone == "America/Los_Angeles" %}selected{% endif %}>Pacific Time (US)</option>
            <option value="Europe/London" {% if email_timezone == "Europe/London" %}selected{% endif %}>London (GMT/BST)</option>
            <option value="Europe/Paris" {% if email_timezone == "Europe/Paris" %}selected{% endif %}>Central European Time</option>
            <option value="Asia/Kolkata" {% if email_timezone == "Asia/Kolkata" %}selected{% endif %}>India Standard Time (IST)</option>
            <option value="Asia/Tokyo" {% if email_timezone == "Asia/Tokyo" %}selected{% endif %}>Tokyo (JST)</option>
          </select>
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-zinc-950 hover:bg-zinc-850 text-white dark:bg-zinc-100 dark:hover:bg-white dark:text-zinc-950 rounded-xl text-xs font-bold uppercase tracking-wider shadow-md shadow-zinc-900/10 transition-colors active:scale-98">
          Get Started &rarr;
        </button>
      </form>

      <div class="mt-8 text-center text-xs text-zinc-400 dark:text-zinc-500 border-t border-zinc-150 dark:border-zinc-800 pt-5">
        Already registered? <a href="/auth/login" class="text-blue-600 dark:text-blue-400 hover:text-blue-700 font-bold">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
