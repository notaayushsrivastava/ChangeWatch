name: Migrate Neon database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type migrate to apply pending Alembic revisions to Neon"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "migrate"

permissions:
  contents: read

concurrency:
  group: changewatch-neon-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: python -m pip install "alembic==1.16.5" "psycopg[binary]==3.2.10" "SQLAlchemy==2.1.4" "pydantic-settings==2.15.0" "cryptography==50.0.1"
      - name: Require the Neon connection secret
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add NEON_DATABASE_URL under repository Actions secrets. Use the Neon unpooled PostgreSQL URL for migrations."
            exit 1
          fi
      - name: Refuse to baseline a pre-existing unversioned schema
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.config import settings

          engine = create_engine(settings.DATABASE_URL, pool_pre_ping=True)
          try:
              tables = set(inspect(engine).get_table_names())
              existing = tables - {"alembic_version"}
              if "alembic_version" not in tables and existing:
                  raise SystemExit(
                      "Refusing to run the initial migration because the database already "
                      f"has unversioned tables: {', '.join(sorted(existing))}. Inspect/baseline "
                      "the schema first; no migration was applied."
                  )
          finally:
              engine.dispose()
          print("Database is empty or already Alembic-versioned; proceeding.")
          PY
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          APP_ENV: production
        run: python -m scripts.init_db
